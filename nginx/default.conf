server {
    listen 80;
    root /usr/share/nginx/html;

    # htmls of Potree
    location /potree/ {
        alias /usr/share/nginx/potree/;
        # index index.html;
        autoindex off;
    }

    location /potree/_page/ {
        alias /usr/share/nginx/potree/_page/;
        # index index.html;
        autoindex on;
    }

    location /potree/_data/ {
        alias /usr/share/nginx/potree/_data/;
        # index index.html;
        autoindex off;
        # IP allowlist + Basic Auth (both required)
        allow 192.168.207.0/24;
        deny all;
        # Require authentication for all Potree data under _data
        auth_basic "Restricted Potree Data";
        auth_basic_user_file /etc/nginx/.htpasswd;
        # satisfy any;
    }

    # fallback: 404
    location / {
        return 404;
    }
}
